# Single source of truth for the canonical storyline:
#   "Why did today's sales drop?"
# Three systems tell ONE coherent story from this spec:
#   - PostgreSQL (sales data): mobile-checkout conversion collapse in the incident window
#   - Monitoring (monitoring-mcp fixtures): checkout error rate rises after the deployment,
#     an alert fires, an incident opens
#   - GitHub (github-mcp): the checkout deployment that preceded the degradation
#
# Dates/times are pinned (not relative to now) so every dataset is deterministic
# and reproducible. end_date is "today" for the storyline.

scenario:
  name: checkout_incident_v1
  seed: 42
  start_date: 2026-07-08        # first sales day (inclusive)
  end_date: 2026-10-05          # last sales day (inclusive) == "today"; 90 days total

  baseline:                     # healthy reference window used by compare_sales
    start_date: 2026-09-06
    end_date: 2026-10-02

  incident:                     # the sales-decline window
    start_date: 2026-10-03
    end_date: 2026-10-05
    affected_channel: mobile
    description: >
      A defective checkout release degrades the mobile checkout flow:
      mobile conversion collapses while desktop is only mildly affected.

  impact:                       # multipliers applied to expected daily units, per incident day
    channel_multipliers:
      mobile: [0.50, 0.42, 0.38]
      desktop: [0.97, 0.94, 0.93]

  deployment:                   # engineering event (github-mcp scenario fixture)
    repository: ronni86bit/MCP-Agent-Project
    service: checkout
    environment: production
    deployed_at: 2026-10-02T18:30:00Z   # shortly before the degradation begins
    commit_message: "checkout: switch mobile payment flow to a new payment provider adapter"

  monitoring:                   # operational telemetry timeline (monitoring-mcp fixtures)
    services: [checkout, payment, catalog, web]
    alert:
      id: ALT-2071
      service: checkout
      metric: error_rate
      severity: high
      fired_at: 2026-10-03T06:00:00Z    # after degradation starts, before the incident opens
      message: "checkout error_rate above 5% for 15m following the 18:30Z production deployment; mobile conversion collapsing"
    incident:
      id: INC-1042
      service: checkout
      severity: high
      started_at: 2026-10-03T08:00:00Z
      resolved_at: null                  # still open at "today"
      title: "Checkout error rate elevated on mobile"
      summary: >
        Checkout error rate spiked after the 18:30Z production deployment;
        mobile payment conversions are failing at elevated rates.
