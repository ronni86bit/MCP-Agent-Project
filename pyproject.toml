[project]
name = "ops-investigation-agent"
version = "0.1.0"
description = "AI Operations Investigation Agent — dynamic tool discovery and invocation over MCP across PostgreSQL, GitHub, and Monitoring/Incident telemetry."
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2,<3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "structlog>=24.1",
    "anyio>=4.4",
    "asyncpg>=0.30",
    "pyyaml>=6.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
