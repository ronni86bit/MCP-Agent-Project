# Frontend console + API reverse proxy (Phase 10 Gate 2).
# Local single-operator demo: this server is loopback-published by Compose
# and MUST NOT be exposed publicly — the API behind it is unauthenticated.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # static console
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + SSE: every backend route lives under /api (investigations,
    # approvals, health variants are proxied separately below). HTTP/1.1 +
    # empty Connection header keep the stream alive; buffering MUST stay off
    # for server-sent events.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # investigations run for many minutes on CPU inference
        proxy_connect_timeout 10s;
    }

    # operational endpoints (loopback-published at the host, proxied for
    # console convenience)
    location = /health {
        proxy_pass http://backend:8000;
    }
    location = /ready {
        proxy_pass http://backend:8000;
    }
    location = /metrics {
        proxy_pass http://backend:8000;
    }
}
